[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "language-simulator"
version = "0.1.0"
description = "Language trainer: demo-version"
authors = [
    { name = "Anna", email = "vorontsann@yandex.ru" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]
